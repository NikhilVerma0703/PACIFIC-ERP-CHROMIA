# Provision the single Robo account — manual, one-off.
# No-admin version: needs NO repo secret of its own. It reads the DATABASE_URL
# secret that already exists in this repo (the DB-backup workflow uses it), and
# takes the new account's password as a run input. So Write access is enough —
# you do NOT need the Settings tab.
#
# Creates ONE row in the production "users" table: role ROBO, branch SHOP_FLOOR.
# It never modifies an existing account — scripts/provision-robo-user.ts stops
# if the email is already taken. Runs ONLY when you click "Run workflow".
#
# ---------------------------------------------------------------------------
# EXPOSURE: a workflow_dispatch input is shown on the run's summary page to
# anyone with read access on the repo. The step below masks it in the logs, but
# not on that summary page. Because this is the lowest-privilege role (ROBO is
# confined to /robo) and a temporary password, that is an acceptable trade — but
# DELETE THE RUN once you have signed in:  Actions -> this run -> "..." -> Delete
# workflow run. Then delete this workflow file too.
# ---------------------------------------------------------------------------

name: Provision Robo account

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email for the Robo account (e.g. robo.incharge@thepacific.group)"
        required: true
        type: string
      password:
        description: "Password for the account (8+ chars). You will type this to log in."
        required: true
        type: string
      name:
        description: "Display name shown in Users & Roles"
        required: false
        default: "Robo Incharge"
        type: string

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create the Robo account
        env:
          DATABASE_URL:       ${{ secrets.DATABASE_URL }}
          ROBO_EMAIL:         ${{ inputs.email }}
          ROBO_PASSWORD:      ${{ inputs.password }}
          ROBO_NAME:          ${{ inputs.name }}
          CONFIRM_PRODUCTION: "yes"
        run: |
          # Keep the password out of the step logs (does not affect the run
          # summary page — delete the run after signing in, per the note above).
          echo "::add-mask::$ROBO_PASSWORD"
          test -n "$DATABASE_URL"  || { echo "::error::DATABASE_URL secret is not set on this repo"; exit 1; }
          test -n "$ROBO_PASSWORD" || { echo "::error::password input was empty"; exit 1; }
          npx tsx scripts/provision-robo-user.ts
