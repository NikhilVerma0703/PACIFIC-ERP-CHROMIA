# Nightly production DB backup (03:00 IST), kept 30 days as workflow artifacts.
# Requires the DATABASE_URL repo secret (Settings -> Secrets -> Actions).
# Restore: download artifact -> pg_restore --clean --no-owner -d <url> backup.dump
name: DB backup
on:
  schedule:
    - cron: "30 21 * * *"   # 21:30 UTC = 03:00 IST
  workflow_dispatch: {}      # manual run button
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          sudo sh -c 'echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list' 
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "DATABASE_URL secret not set"; exit 1; }
          # use the v17 binary explicitly — the runner's default pg_dump is v16,
          # and pg_dump refuses to dump a newer (PG 17) server
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" --format=custom --no-owner --file=backup.dump
          ls -lh backup.dump
      - uses: actions/upload-artifact@v4
        with:
          name: neon-backup-${{ github.run_id }}
          path: backup.dump
          retention-days: 30
      - name: Data integrity check (batch keys normalized)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Every batch_key must be normalized (no letter prefixes, spaces or commas).
          # A non-zero count means some writer regressed — fail the run so GitHub
          # notifies the repo owner. (Backup above has already been uploaded.)
          BAD=$(/usr/lib/postgresql/17/bin/psql "$DATABASE_URL" -t -A -c "
            SELECT COALESCE(SUM(n),0) FROM (
              SELECT count(*) n FROM press        WHERE batch_key ~ '^[A-Za-z]' OR batch_key ~ '[ ,]'
              UNION ALL SELECT count(*) FROM oven         WHERE batch_key ~ '^[A-Za-z]' OR batch_key ~ '[ ,]'
              UNION ALL SELECT count(*) FROM jot          WHERE batch_key ~ '^[A-Za-z]' OR batch_key ~ '[ ,]'
              UNION ALL SELECT count(*) FROM distributor  WHERE batch_key ~ '^[A-Za-z]' OR batch_key ~ '[ ,]'
              UNION ALL SELECT count(*) FROM kreos        WHERE batch_key ~ '^[A-Za-z]' OR batch_key ~ '[ ,]'
              UNION ALL SELECT count(*) FROM polish_entry WHERE batch_key ~ '^[A-Za-z]' OR batch_key ~ '[ ,]'
              UNION ALL SELECT count(*) FROM polish_qc    WHERE batch_key ~ '^[A-Za-z]' OR batch_key ~ '[ ,]'
            ) x")
          echo "Un-normalized batch keys: $BAD"
          test "$BAD" = "0" || { echo "::error::$BAD rows have un-normalized batch_key — a writer has regressed (see docs: src/lib/normalizeBatch.ts)"; exit 1; }
