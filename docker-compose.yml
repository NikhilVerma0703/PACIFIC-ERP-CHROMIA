services:
  postgres:
    image: postgres:16
    container_name: pacific-erp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pacific
      POSTGRES_PASSWORD: pacific
      POSTGRES_DB: pacific_erp
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pacific -d pacific_erp"]
      interval: 5s
      timeout: 5s
      retries: 10
